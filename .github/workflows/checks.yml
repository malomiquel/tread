# The three commands every change in this repository is checked with
# locally, run again where forgetting is not an option.
#
# Deliberately the same three, called through the same npm scripts rather
# than spelled out here: a pipeline that checks something subtly different
# from what a developer runs is a pipeline that eventually disagrees with
# them, and the disagreement is always found at the worst moment.
name: Vérifications

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typage, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # app.config.js derives the version from the history — how many
          # feats, how many fixes, how many commits in all. A shallow clone
          # would quietly report a version that is not the one being built.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
